[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knuth"
version = "2.0.0.dev0"
description = "Knuth kernel sidecar: the live-session server and reproducibility runner of the Claerbout suite"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
]

[project.scripts]
knuth = "knuth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knuth*"]
