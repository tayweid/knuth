[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knuth"
version = "2.0.0.dev0"
description = "Knuth kernel sidecar: the live-session server and reproducibility runner of the Claerbout suite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Taylor J Weidman" },
]
requires-python = ">=3.11"
keywords = ["reproducible-research", "python", "pwa", "literate-programming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 14.0 is the floor: `websockets.serve` became the asyncio implementation
    # there, whose process_request hook receives a Request and may return a
    # Response. That is how the engine serves the app on its own port
    # (SAME_ORIGIN.md). On 13.x the legacy server hands process_request a
    # Headers object instead and every page request 500s.
    "websockets>=14.0",
]

[project.urls]
Homepage = "https://knuth.tayweid.io"
Repository = "https://github.com/tayweid/knuth"
Issues = "https://github.com/tayweid/knuth/issues"

[project.optional-dependencies]
test = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pytest>=8.0",
]

[project.scripts]
knuth = "knuth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knuth*"]

# The built app, staged by `npm run build:engine`. The engine serves it
# from its own port, so it must ride along in the wheel (SAME_ORIGIN.md).
[tool.setuptools.package-data]
knuth = ["web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
