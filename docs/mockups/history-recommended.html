            else if (e.cells.has(k) || (c.kind === 'user' && !c.tie)) { st[k] = 'back'; back.push(k); }
          }
          return { st, back, out, come, n: Math.max(tN, nN) };
        }
        function dmapHTML(n, st, key) {
          let s = '';
          for (let k = 1; k <= n; k++) s += `<i class="${st[k] || ''}">${k}</i>`;
          const K = { chg: ['rgba(110,165,118,.45)', 'changed'], out: ['transparent;box-shadow:inset 0 0 0 1px rgba(205,100,82,.6)', 'comes out'], back: ['rgba(201,138,29,.45)', 'goes back'], come: ['rgba(157,184,214,.45)', 'comes back'] };
          const used = [...new Set(Object.values(st))];
          const keyH = key ? `<div class="dkey">${used.map((u) => `<span><i style="background:${K[u][0]}"></i>${K[u][1]}</span>`).join('')}<span><i style="background:rgba(255,255,255,.08)"></i>the same</span></div>` : '';
          return `<div class="dmap">${s}</div>${keyH}`;
        }
        function goBack(path, e, t, c) {
          const D = S.data;
          if (path === D.doc && c) {
            const { back, out, come } = cellStates(c, e);
            const verb = (a, one, many) => `${listCells(a)} ${a.length === 1 ? one : many}`;
            const parts = [];
            if (back.length) parts.push(verb(back, 'goes back', 'go back'));
            if (out.length) parts.push(verb(out, 'comes out', 'come out'));
            if (come.length) parts.push(verb(come, 'comes back', 'come back'));
            return parts.length ? parts.join('; ') : 'goes back';
          }
          if (path === D.doc) return e.cells.size ? `${listCells([...e.cells])} go${e.cells.size === 1 ? 'es' : ''} back` : 'goes back';
          if (path === 'values.json') return e.names.size ? `${[...e.names].join(', ')} go${e.names.size === 1 ? 'es' : ''} back` : 'goes back';
          if (path.startsWith('figs/')) return `the figure as it was at ${t}`;
          if (path === 'paper.typ') return e.words ? `about ${Math.max(10, Math.round(e.words / 10) * 10)} words written since ${t} leave the page; they stay in the record` : `goes back to ${t}`;
          if (path === MANIFEST) return '';
          return 'goes back';
        }

        /* ================= state ================= */
        // host: the app whose shell runs this History window (the one that can save and reload its
        // own windows); paused: the record's guard, when one holds; late: Plass opened a file the
        // rewind writes after the card was drawn (the shell refuses with 'other-app').
        const S = { state: 'rest', data: null, zoom: 'runs', sel: null, dayFold: new Map(), openClusters: new Set(), showBranch: false, busy: false, rows: [], rmap: new Map(), landed: null, cardX: 580, host: 'Knuth', paused: null, late: null, selAt: 0, hintOn: false };

        /* ================= rows: the river laid out down the page ================= */
        function itemsOf(d) {
          const D = S.data;
          const list = d.commits.slice();
          if (D.branch && S.showBranch) D.branch.commits.forEach((u) => { if (u.day === d.key) list.push(u); });
          return list.sort((a, b) => a.s - b.s);
        }
        function dayFolded(d) {
          if (S.dayFold.has(d.key)) return S.dayFold.get(d.key);
          if (S.zoom === 'days') return true;
          return !!d.fold;
        }
        function build() {
          const D = S.data, rows = [];
          let y = G.top;
          const push = (r) => { r.h = HT[r.type]; r.y = y; r.cy = y + r.h / 2; y += r.h; rows.push(r); return r; };
          D.days.forEach((d) => {
            if (dayFolded(d)) { push({ type: 'dayfold', day: d, items: itemsOf(d) }); return; }
            push({ type: 'dayhead', day: d });
            const items = itemsOf(d);
            let last = null;
            for (let i = 0; i < items.length; i++) {
              const c = items[i];
              if (c.kind !== 'user') {
                if (last !== null && c.s - last > G.gap) push({ type: 'gap', span: c.s - last });
                last = c.s;
              }
              if (c.kind === 'timer' && S.zoom !== 'all' && !S.openClusters.has(c.sha)) {
                let j = i;
                while (j + 1 < items.length && items[j + 1].kind === 'timer' && items[j + 1].s - items[j].s <= G.gap) j++;
                if (j - i + 1 >= 3) { push({ type: 'cluster', items: items.slice(i, j + 1), key: c.sha }); last = items[j].s; i = j; continue; }
              }
              push({ type: c.kind, item: c });
            }
          });
          push({ type: 'now' });
          return { rows, height: y + G.bottom };
        }

        function rowHTML(r, i) {
          const D = S.data;
          const c = r.item;
          let tm = '', nd = '', lb = '', pick = false;
          const tags = c ? (D.rewoundTo.get(c.sha) || []).map((x) => `<span class="tag">↺ ${hm(x.s)}</span>`).join('') : '';
          switch (r.type) {
            case 'dayhead': {
              const n = r.day.commits.length;
              lb = `<span class="lb">${dayInfo(r.day.key).long}<span class="n">${plural(n, 'commit')}</span><span class="chev">fold ▴</span></span>`;
              break;
            }
            case 'dayfold': {
              const cs = r.day.commits, info = dayInfo(r.day.key);
              const runs = cs.filter((x) => x.kind === 'run').length, errs = cs.filter((x) => x.kind === 'run' && x.err).length, timers = cs.filter((x) => x.kind === 'timer').length, rws = cs.filter((x) => x.kind === 'rto').length;
              const us = r.items.filter((x) => x.kind === 'user').length;
              const first = D.flat[0] && D.flat[0].day === r.day.key ? ' · the record begins' : '';
              lb = `<span class="lb"><b>${info.short}</b><span class="hint">${hm(cs[0].s)}–${hm(cs[cs.length - 1].s)} · ${plural(runs, 'run')}${errs ? `, ${errs} raised` : ''} · ${plural(timers, 'timer commit')}${rws ? ' · ' + plural(rws, 'rewind') : ''}${us ? ' · ' + us + ' on ' + D.branch.name : ''}${first}</span></span>`;
              pick = true;
              break;
            }
            case 'gap': {
              const m = Math.round(r.span / 60);
              lb = `<span class="lb it">${m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'} with nothing recorded</span>`;
              break;
            }
            case 'cluster': {
              const a = r.items[0], b = r.items[r.items.length - 1];
              const cells = [...new Set(r.items.filter((x) => x.edit === 'doc' && x.cell).map((x) => x.cell))];
              const what = [cells.length ? listCells(cells) : '', r.items.some((x) => x.edit === 'paper') ? 'paper.typ' : ''].filter(Boolean).join(', ');
              tm = `<span class="tm" style="color:var(--room-ink-faint)">${hm(a.s)}</span>`;
              nd = '<i class="nd beads"><b></b><b></b><b></b></i>';
              lb = `<span class="lb">${r.items.length} timer commits${what ? ' · ' + what : ''}<span class="hint">until ${hm(b.s)}</span></span>`;
              pick = true;
              break;
            }
            case 'now': {
              tm = `<span class="tm">${hm(D.now.s)}</span>`;
              nd = '<i class="nd now"></i>';
              lb = `<span class="lb soft"><span style="color:var(--room-ink)">now</span><span class="hint">${S.paused ? `nothing is recorded while ${esc(S.paused)}` : 'the record commits within a minute of any change'}</span></span>`;
              break;
            }
            case 'run': {
              tm = `<span class="tm">${hm(c.s)}</span>`;
              nd = `<i class="nd run${c.err ? ' err' : ''}"></i>`;
              const figs = changesOf(c).filter((x) => x.fig).map((x) => x.path.replace('figs/', ''));
              lb = `<span class="lb">${labelHTML(c)}${figs.length ? `<span class="hint">· ${figs.join(', ')}</span>` : ''}${first(c)}${tags}${again(c)}</span>`;
              pick = true;
              break;
            }
            case 'timer': {
              tm = `<span class="tm ghost">${hm(c.s)}</span>`;
              nd = '<i class="nd bead"></i>';
              lb = `<span class="lb${tags ? '' : ' ghost'}">${labelHTML(c)}<span class="hint">· ${c.edit === 'paper' ? 'paper.typ' : 'cell ' + c.cell}</span>${tags}${again(c)}</span>`;
              if (tags) tm = `<span class="tm">${hm(c.s)}</span>`;
              pick = true;
              break;
            }
            case 'open': case 'close': {
              tm = `<span class="tm">${hm(c.s)}</span>`;
              nd = '<i class="nd weir"></i>';
              lb = `<span class="lb soft">${labelHTML(c)}${first(c)}${tags}${again(c)}</span>`;
              pick = true;
              break;
            }
            case 'rfrom': {
              tm = `<span class="tm">${hm(c.s)}</span>`;
              nd = '<i class="nd ring"></i>';
              lb = `<span class="lb">${labelHTML(c)}<span class="hint">· the files as they were, kept</span>${tags}${again(c)}</span>`;
              pick = true;
              break;
            }
            case 'rto': {
              const t = D.flat[D.index.get(c.target)];
              tm = `<span class="tm">${hm(c.s)}</span>`;
              nd = `<i class="nd back">${BACK}</i>`;
              lb = `<span class="lb">${labelHTML(c)}<span class="hint">· back to ${t ? when(t) + ', ' + esc(shortMsg(t)) : ''}</span>${tags}${again(c)}</span>`;
              pick = true;
              break;
            }
            case 'user': {
              const B = D.branch;
              const isTip = B.commits[B.commits.length - 1] === c;
              tm = `<span class="tm">${hm(c.s)}</span>`;
              nd = '<i class="nd sq"></i>';
              lb = `<span class="lb user">${esc(c.msg)}${isTip ? `<span class="br">${B.name}</span>` : ''}${again(c)}</span>`;
              pick = true;
              break;
            }
          }
          const sel = c && S.sel === c.sha ? ' sel' : '';
          const near = !sel && S.selRow >= 0 && Math.abs(i - S.selRow) <= 2 ? ' near' : '';
          const hint = sel && S.hintOn ? ' show-again' : '';
          const landed = c && S.landed && S.landed.has(c.sha) ? ' landed' : '';
          return `<div class="row t-${r.type}${pick ? ' pick' : ''}${sel}${near}${hint}${landed}" data-i="${i}" style="top:${r.y}px;height:${r.h}px;width:${S.cardX - 18}px">${tm}${nd}${lb}</div>`;
        }
        // Whether a rewind to this commit would change anything, and is allowed now.
        function rewindable(c) { return !S.paused && fromNow(c).some(([p]) => p !== MANIFEST); }
        // The selected node's hint: a second click rewinds.
        function again(c) { return S.sel === c.sha && rewindable(c) ? `<span class="again">click again to rewind to ${when(c)}</span>` : ''; }
        function first(c) { return S.data.flat[0] === c ? '<span class="hint">· the record begins</span>' : ''; }
        function shortMsg(c) { const m = message(c); return c.kind === 'run' ? m.slice(m.indexOf(': ') + 2) : m; }

        /* ---------- the drawing: river, reaches, tributary, ties, arcs ---------- */
        function linesSVG(rows, height) {
          const D = S.data, rx = G.rx, tx = G.tx, P = [];
          const pts = rows.filter((r) => r.type !== 'user');
          for (let k = 1; k < pts.length; k++) {
            const a = pts[k - 1], b = pts[k];
            if (k === 1 && a.type === 'dayhead') continue;
            const y1 = a.type === 'dayfold' ? a.y + a.h - 9 : a.cy;
            const y2 = b.type === 'dayfold' ? b.y + 9 : b.cy;
            const dotted = a.type === 'gap' || b.type === 'gap' || a.type === 'dayhead' || b.type === 'dayhead' || (a.type === 'dayfold' && b.type === 'dayfold');
            P.push(`<line class="riv${dotted ? ' dot' : ''}" x1="${rx}" y1="${y1}" x2="${rx}" y2="${y2}"/>`);
          }
          rows.forEach((r) => { if (r.type === 'dayfold') P.push(`<rect class="reach" x="${rx - 3.5}" y="${r.y + 9}" width="7" height="${r.h - 18}" rx="3.5"/>`); });
          if (D.branch && S.showBranch) {
            const urows = [];
            D.branch.commits.forEach((u) => { const r = S.rmap.get(u.sha); if (r && urows[urows.length - 1] !== r) urows.push(r); });
            if (urows.length) {
              if (D.branch.earlier) P.push(`<line class="trib fade" x1="${tx}" y1="0" x2="${tx}" y2="${urows[0].cy}"/>`);
              P.push(`<line class="trib" x1="${tx}" y1="${urows[0].cy}" x2="${tx}" y2="${urows[urows.length - 1].cy}"/>`);
              urows.forEach((r) => { if (r.type === 'dayfold') P.push(`<rect class="tribmark" x="${tx - 4}" y="${r.cy - 4}" width="8" height="8" rx="2.2"/>`); });
            }
            D.branch.commits.forEach((u) => {
              const ur = S.rmap.get(u.sha), tr = u.tie && S.rmap.get(u.tie);
              if (!ur || ur.type !== 'user' || !tr || tr === ur) return;
              const y1 = tr.cy, y2 = ur.cy;
              const mx = (rx + tx) / 2;
              P.push(`<path class="tie${u.near ? ' near' : ''}" d="M${rx + 6},${y1} C${mx + 4},${y1} ${mx - 4},${y2} ${tx - 8},${y2}"/>`);
            });
          }
          const lanes = [];
          rows.filter((r) => r.type === 'rto').forEach((r) => {
            const tr = S.rmap.get(r.item.target);
            if (!tr || tr === r) return;
            const y1 = tr.cy, y2 = r.cy;
            let lane = 0;
            while (lanes.some((l) => l.lane === lane && !(l.y2 < y1 - 4 || l.y1 > y2 + 4))) lane++;
            lanes.push({ lane, y1, y2 });
            const ax = rx - 24 - lane * 10;
            P.push(`<path class="arc" d="M${rx - 10},${y2} H${ax + 7} Q${ax},${y2} ${ax},${y2 - 7} V${y1 + 7} Q${ax},${y1} ${ax + 7},${y1} H${rx - 10}"/>`);
            P.push(`<path class="arrow" d="M${rx - 15},${y1 - 3.5} L${rx - 10},${y1} L${rx - 15},${y1 + 3.5}"/>`);
          });
          const defs = '<defs><linearGradient id="tribfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(216,214,209,0)"/><stop offset="1" stop-color="rgba(216,214,209,0.4)"/></linearGradient></defs>';
          return { html: defs + P.join(''), height };
        }

        /* ================= render ================= */
        const scroll = $('#scroll'), river = $('#river'), lines = $('#lines'), rowsEl = $('#rows'), card = $('#card'), tie = $('#tie'), mini = $('#mini');
        function render() {
          const D = S.data;
          const w = Math.min(G.w, Math.max(560, scroll.clientWidth - 36));
          S.cardX = w - G.cardW;
          river.style.width = w + 'px';
          D.rewoundTo = new Map();
          D.flat.forEach((c) => { if (c.kind === 'rto') { const a = D.rewoundTo.get(c.target) || []; a.push(c); D.rewoundTo.set(c.target, a); } });
          const { rows, height } = build();
          S.rows = rows;
          S.rmap = new Map();
          rows.forEach((r) => { if (r.item) S.rmap.set(r.item.sha, r); if (r.items) r.items.forEach((c) => S.rmap.set(c.sha, r)); });
          const sr = S.sel ? S.rmap.get(S.sel) : null;
          S.selRow = sr && sr.item ? rows.indexOf(sr) : -1;
          const branch = D.branch && S.showBranch;
          river.style.setProperty('--rx', G.rx + 'px');
          river.style.setProperty('--tx', G.tx + 'px');
          river.style.setProperty('--lx', (branch ? G.lxb : G.lx) + 'px');
          river.style.setProperty('--timer', G.timeR + 'px');
          river.style.height = height + 'px';
          const L = linesSVG(rows, height);
          lines.setAttribute('width', w);
          lines.setAttribute('height', height);
          lines.innerHTML = L.html;
          rowsEl.innerHTML = rows.map(rowHTML).join('');
          paintChrome();
          placeCard();
          drawMini();
        }
        function paintChrome() {
          const D = S.data;
          $('#t-path').textContent = D.path;
          const today = D.days.find((d) => d.key === TODAY);
          $('#t-meta').textContent = `${plural(D.flat.length, 'commit')}${today && D.days.length > 2 ? '' : ` · ${today ? today.commits.length : 0} today`} · claerbout-autosave`;
          $('#here').innerHTML = D.windows.map(([k, app, doc]) => `<span class="app" title="${app}">${k}</span><span class="doc">${doc}</span>`).join('');
          $$('#zoom button').forEach((b) => { b.disabled = false; b.classList.toggle('on', b.dataset.z === S.zoom); });
          const rb = $('#rb-branch');
          rb.disabled = !D.branch;
          rb.classList.toggle('on', !!(D.branch && S.showBranch));
          rb.dataset.label = D.branch ? (S.showBranch ? `Hide ${D.branch.name}` : `Show ${D.branch.name}`) : 'No branches of your own in this project';
          $('#rb-proj').dataset.label = D.name;
          const rec = $('#rec');
          rec.hidden = !S.paused;
          if (S.paused) rec.querySelector('.why2').textContent = S.paused;
        }

        /* ---------- the card ---------- */
        function itemBySha(sha) {
          const D = S.data;
          if (D.index.has(sha)) return D.flat[D.index.get(sha)];
          return D.branch ? D.branch.commits.find((u) => u.sha === sha) : null;
        }
        function placeCard() {
          const c = S.sel && itemBySha(S.sel);
          const r = c && S.rmap.get(c.sha);
          if (!c || !r || !r.item) { card.hidden = true; tie.hidden = true; return; }
          card.hidden = false;
          card.style.left = S.cardX + 'px';
          card.style.width = G.cardW + 'px';
          if (!S.busy) card.innerHTML = cardHTML(c);
          const need = r.cy + card.offsetHeight + 60;
          if (need > river.offsetHeight) river.style.height = need + 'px';
          fitCard();
          const rowEl = rowsEl.children[S.rows.indexOf(r)];
          const lb = rowEl && rowEl.querySelector('.lb');
          const x1 = lb ? lb.offsetLeft + lb.offsetWidth + 12 : G.rx + 16;
          if (x1 < S.cardX - 14) {
            tie.hidden = false;
            tie.style.left = x1 + 'px';
            tie.style.top = r.cy + 'px';
            tie.style.width = S.cardX - x1 + 'px';
          } else tie.hidden = true;
        }
        // The card's head sits on the node's line; when that would run the card off the bottom
        // of the room it lifts, as far as keeping the node's line inside the card allows.
        function fitCard() {
          if (card.hidden || !S.sel) return;
          const r = S.rmap.get(S.sel);
          if (!r) return;
          card.style.maxHeight = scroll.clientHeight - 22 + 'px';
          const h = card.offsetHeight;
          const vt = scroll.scrollTop + 10, vb = scroll.scrollTop + scroll.clientHeight - 12;
          let top = r.cy - 22;
          if (top + h > vb) top = vb - h;
          if (top < vt) top = vt;
          top = Math.min(top, r.cy - 22);
          top = Math.max(top, r.cy - h + 22);
          card.style.top = Math.max(8, top) + 'px';
        }
        scroll.addEventListener('scroll', fitCard, { passive: true });
        function prevRecord(c) {
          const D = S.data;
          if (c.kind === 'user') {
            const B = D.branch.commits, i = B.indexOf(c);
            return i > 0 ? B[i - 1] : null;
          }
          const i = D.index.get(c.sha);
          return i > 0 ? D.flat[i - 1] : null;
        }
        function glyph(c) {
          if (c.kind === 'run' && c.err) return '<i class="g-err"></i>';
          return { run: '<i class="g-run"></i>', timer: '<i class="g-bead"></i>', open: '<i class="g-weir"></i>', close: '<i class="g-weir"></i>', rfrom: '<i class="g-ring"></i>', rto: `<i class="g-back">${BACK}</i>`, user: '<i class="g-sq"></i>' }[c.kind];
        }
        function changeHTML(ch, c) {
          const D = S.data;
          const stat = ch.plus != null ? `<span class="fs"><i class="pl">+${ch.plus}</i> <i class="mi">−${ch.minus || 0}</i></span>` : '';
          let h = `<div class="fr"><span class="fp">${esc(ch.path)}</span>${stat}</div>`;
          if (ch.fig) {
            h += `<div class="thumbrow"><span class="thumb"><svg viewBox="0 0 460 ${D.thumbs[ch.fig] === 'multi' ? 132 : 300}"><use href="#fig-${D.thumbs[ch.fig]}"/></svg></span><span class="fn">${esc(ch.note || 'redrawn')}</span></div>`;
          } else if (ch.note) h += `<div class="fn">${esc(ch.note)}</div>`;
          // the document's cells, the changed ones lit
          const lit = [].concat(ch.cell ? [ch.cell] : [], ch.cells || []);
          if (ch.path === D.doc && lit.length && cellsOf(c)) {
            const st = {};
            lit.forEach((k) => (st[k] = 'chg'));
            h += dmapHTML(Math.max(cellsOf(c), ...lit), st, false);
          }
          let diff = ch.diff;
          if (!diff && ch.cell && ch.path === D.doc && D.code[ch.cell]) diff = [['p', D.code[ch.cell]]];
          if (diff) h += `<div class="diff"><span class="cl"># %% cell ${ch.cell}</span>${diff.map(([k, t]) => `<span class="${k}">${k === 'm' ? '−' : '+'}</span> ${esc(t)}`).join('\n')}</div>`;
          return h;
        }
        // The windows on this project in another app: this shell cannot ask them to save or reload.
        function othersOf() { return S.data.windows.filter((w) => w[1] !== S.host); }
        function ownOf() { return S.data.windows.filter((w) => w[1] === S.host); }
        function cardHTML(c) {
          const D = S.data;
          const isUser = c.kind === 'user';
          const day = dayInfo(c.day).long;
          const title = isUser ? `<div class="cname user">${esc(c.msg)}</div>` : `<div class="cname">${labelHTML(c)}</div>`;
          const meta = isUser
            ? `${D.branch.name} · ${D.branch.author} · ${day}, ${hms(c.s)} · <span class="sha">${c.sha}</span>`
            : `${day}, ${hms(c.s)} · <span class="sha">${c.sha}</span>`;
          let note = '';
          if (isUser) {
            const t = c.tie && itemBySha(c.tie);
            if (!c.tie) note = `<div class="note">Made before the record began, so no record commit holds these files.</div>`;
            else if (c.near) note = `<div class="note"><span class="eq">≈</span>The record at <b>${when(t)}</b> (${esc(message(t))}) holds these files, except that this commit ${esc(c.near.text)}.</div>`;
            else note = `<div class="note"><span class="eq">=</span>The same files as the record at <b>${when(t)}</b> (${esc(message(t))}).</div>`;
          } else if (c.kind === 'rto') {
            const t = itemBySha(c.target), f = itemBySha(c.from);
            note = `<div class="note">The files of <b>${t ? when(t) : c.target}</b>${t ? ` (${esc(shortMsg(t))})` : ''}, written back${f ? ` from <span class="eq" style="margin:0">${f.sha}</span> just above` : ''}. Nothing between them was removed.</div>`;
          } else if (c.kind === 'rfrom') {
            note = `<div class="note">Your files at the moment you rewound: <span class="eq" style="margin:0">${c.from}</span> plus what had not been recorded yet. Rewinding here undoes that rewind.</div>`;
          } else if (c.err) {
            note = `<div class="note err">The run raised <b>${esc(c.errText || 'an error')}</b>. The saved output holds the traceback.</div>`;
          }
          const prev = prevRecord(c);
          const vs = isUser ? (prev ? `since “${esc(prev.msg)}”` : 'the first on ' + D.branch.name) : prev ? `since ${when(prev)}, ${esc(message(prev))}` : 'the first commit';
          const chs = changesOf(c);
          const thisSec = `<div class="sec"><div class="sl">This commit<span>${vs}</span></div>${chs.length ? chs.map((ch) => changeHTML(ch, c)).join('') : '<div class="fn">No file changes.</div>'}</div>`;

          const diffs = fromNow(c);
          const t = when(c);
          const after = (() => { const i = D.index.get(isUser ? c.tie : c.sha); return i == null ? null : D.flat.length - 1 - i; })();
          const back = c.day === TODAY ? `${Math.max(1, Math.round((D.now.s - c.s) / 60))} min back` : `${dayInfo(c.day).short}`;
          const others = othersOf();
          const winOf = (p) => { const w = D.windows.find((x) => x[2] === p); return w ? `<span class="win">open in ${w[1]}</span>` : ''; };
          let rwSec;
          const choose = diffs.filter(([p]) => p !== MANIFEST);
          if (!choose.length) {
            rwSec = `<div class="sec"><div class="sl">Rewinding here</div><div class="fn">This is where you are: the files now are this commit’s.</div></div>
              <div class="act"><button class="rw" disabled>${BACK} You are here</button></div>`;
          } else {
            const rowsH = choose.map(([p, e]) => {
              const held = others.find((w) => w[2] === p);
              const warn = (p === 'paper.typ' && e.words) || held ? ' warn' : '';
              const n = e.near ? `this commit has it as it was before; what you wrote since stays in the record` : goBack(p, e, t, c);
              const strip = p === D.doc ? (() => { const cs = cellStates(c, e); return Object.keys(cs.st).length ? dmapHTML(cs.n, cs.st, true) : ''; })() : '';
              return `<label class="nr${warn}"><input type="checkbox" checked data-path="${esc(p)}"${S.paused ? ' disabled' : ''}><span class="nb"><span class="fp">${esc(p)}</span>${winOf(p)}<span class="nn">${esc(n)}</span>${strip}</span></label>`;
            }).join('');
            const man = diffs.some(([p]) => p === MANIFEST) ? `<div class="nr fixed"><span class="nb"><span class="fp">untracked/</span><span class="nn">stays as it is: the record keeps only names and hashes there</span></span></div>` : '';
            const held = others.filter((w) => choose.some(([p]) => p === w[2]));
            const otherH = held.length ? `<div class="other"><b>${held.map((w) => w[2]).join(', ')} ${held.length === 1 ? 'is' : 'are'} open in ${held[0][1]}</b>, a separate app, so it is not saved first. Close it there or untick it; rewound anyway, ${held[0][1]} reloads it and asks first if it has unsaved changes.</div>` : '';
            const own = isUser ? treeOf(c) : null;
            const notHeld = own ? D.files.filter((p) => !own.has(p) && p !== MANIFEST && p !== '.gitignore') : [];
            const lacks = notHeld.length ? `<div class="same">${notHeld.length > 2 ? plural(notHeld.length, 'file') : notHeld.join(' and ')} ${notHeld.length === 1 ? 'is' : 'are'} not in this commit, so ${notHeld.length === 1 ? 'it stays' : 'they stay'} as now.</div>` : '';
            const same = D.files.length - choose.length - (man ? 1 : 0) - notHeld.length;
            const action = S.paused
              ? `<div class="act"><button class="rw" disabled>${BACK}<span class="rwl">Rewind waits</span></button></div>
                 <p class="why"><b>The record is paused:</b> ${esc(S.paused)}, and git’s work comes first. Nothing is recorded or rewound until it ends; this card stays as it is meanwhile.</p>`
              : `<div class="act"><button class="rw" data-act="rewind">${BACK}<span class="rwl">Rewind to ${t}</span></button><span class="kbd">or click the node again · ⌘↩</span></div>
                 <p class="fine">${ownOf().map((w) => w[2]).join(' and ')} ${ownOf().length === 1 ? 'is' : 'are'} saved first and ${ownOf().length === 1 ? 'reloads' : 'reload'}. Now is recorded first, so this can be undone; ${isUser ? D.branch.name + ' stays where it is, and' : ''} your branch, HEAD and index are not touched. Python’s memory is not rewound: the cells come back stale.</p>`;
            rwSec = `<div class="sec"><div class="sl">Rewinding here<span>${back}${after ? ' · ' + plural(after, 'commit') + ' since' : ''}</span></div>${rowsH}${man}
              <div class="same">${same > 0 ? plural(same, 'other file is', 'other files are') + ' the same at both moments.' : ''}</div>${lacks}${otherH}</div>${action}`;
          }
          return `<div class="ch"><span class="cg">${glyph(c)}</span><div class="ct">${title}<div class="cmeta">${meta}</div></div><button class="cx" data-act="close" aria-label="Close">×</button></div>${note}${thisSec}${rwSec}`;
        }

        /* ---------- rewind ---------- */
        function chosenPaths() {
          const boxes = $$('#card input[data-path]');
          const on = boxes.filter((b) => b.checked).map((b) => b.dataset.path);
          return on.length === boxes.length ? null : on;
        }
        function applyRewind(target, paths) {
          const D = S.data;
          const today = D.days.find((d) => d.key === TODAY);
          const tip = D.flat[D.flat.length - 1];
          let s = Math.max(D.now.s + 70, tip.s + 30);
          let from = tip, rf = null;
          if (D.now.changed.length) {
            rf = { kind: 'rfrom', app: 'knuth', day: TODAY, s, from: tip.sha, sha: D.sha(), changes: D.now.changed.map((p) => ({ path: p, cells: p === D.doc ? D.now.cells.slice() : [], note: p === D.doc ? `typing in ${listCells(D.now.cells)}, not yet recorded when you rewound` : 'not yet recorded when you rewound' })) };
            today.commits.push(rf);
            from = rf;
            s += 1;
          }
          const rt = { kind: 'rto', app: 'knuth', day: TODAY, s, target: target.kind === 'user' ? target.tie || target.sha : target.sha, from: from.sha, sha: D.sha(), paths };
          if (target.kind === 'user') rt.userTarget = target.sha;
          today.commits.push(rt);
          D.now = { s: s + 25, changed: [], cells: [] };
          finish(D);
          D.last = { from, rt, target };
          S.landed = new Set([rt.sha].concat(rf ? [rf.sha] : []));
          return { from, rt, rf };
        }
        // The steps as the shell takes them; each is a `rewind {step, state}` event in the real page.
        function steps(c, paths) {
          const D = S.data;
          const tip = D.flat[D.flat.length - 1];
          const n = paths ? paths.length : fromNow(c).filter(([p]) => p !== MANIFEST).length;
          const own = ownOf(), others = othersOf();
          const target = c.kind === 'user' ? c.tie || c.sha : c.sha;
          const out = [];
          out.push(`Save ${own.map((w) => w[2]).join(', ')} in ${S.host}`);
          out.push(D.now.changed.length ? `Record now: <span class="sha">knuth: rewind from ${tip.sha}</span>` : `Now is the tip, <span class="sha">${tip.sha}</span>: nothing to record`);
          out.push(`Write ${plural(n, 'file')} from <span class="sha">${c.sha}</span> into the folder`);
          out.push(`Record <span class="sha">knuth: rewind to ${target}</span>`);
          out.push(`Reload ${own.map((w) => w[2]).join(' and ')}${others.length ? `; ${others[0][1]} reloads ${others.map((w) => w[2]).join(', ')} when it sees the rewind` : ''}`);
          return out;
        }
        function startRewind(c) {
          if (S.busy || S.paused) return;
          const paths = chosenPaths();
          if (paths && !paths.length) return;
          // The shell checks again before anything is written: here, Plass opened paper.typ after
          // the card was drawn, so the request comes back {refused: 'other-app'}.
          if (S.late && !S.late.answered && (!paths || paths.includes(S.late[2]))) { refuseOther(c); return; }
          S.busy = true;
          S.hintOn = false;
          $$('.row.show-again').forEach((r) => r.classList.remove('show-again'));
          const list = steps(c, paths);
          const refuse = card.querySelector('.refuse');
          const anchor = refuse || card.querySelector('.act');
          const fine = refuse ? null : card.querySelector('.fine');
          if (fine) fine.remove();
          card.querySelectorAll('.nr input').forEach((b) => (b.disabled = true));
          const ol = document.createElement('ol');
          ol.className = 'steps';
          ol.innerHTML = list.map((t) => `<li>${t}</li>`).join('');
          anchor.replaceWith(ol);
          fitCard();
          const lis = $$('li', ol);
          let k = 0;
          const tick = () => {
            if (k > 0) { lis[k - 1].classList.remove('doing'); lis[k - 1].classList.add('done'); }
            if (k < lis.length) { lis[k].classList.add('doing'); k++; setTimeout(tick, 420); return; }
            setTimeout(() => finishRewind(c, paths), 260);
          };
          tick();
        }
        function refuseOther(c) {
          const w = S.late;
          const act = card.querySelector('.act'), fine = card.querySelector('.fine');
          if (fine) fine.remove();
          const div = document.createElement('div');
          div.className = 'refuse';
          div.innerHTML = `<div class="other"><b>${w[2]} is open in ${w[1]} now.</b> It was opened after this list was made, and ${w[1]} is a separate app, so ${S.host} cannot ask it to save first. Nothing has been written.</div>
            <div class="act"><button class="rw" data-act="without">${BACK}<span class="rwl">Without ${w[2]}</span></button><button class="ghostbtn" data-act="anyway">Rewind anyway</button></div>
            <p class="fine">Or close it in ${w[1]} and click the node again. Rewound anyway, ${w[1]} reloads ${w[2]} when it sees the rewind, asking first if it has unsaved changes.</p>`;
          act.replaceWith(div);
          fitCard();
        }
        function finishRewind(c, paths) {
          S.busy = false;
          const res = applyRewind(c, paths);
          S.sel = null;
          render();
          scroll.scrollTop = scroll.scrollHeight;
          toastRewound(c, res, paths);
        }
        function toastRewound(c, res, paths) {
          const D = S.data;
          const others = othersOf().filter((w) => !paths || paths.includes(w[2]));
          const what = c.kind === 'rfrom' ? `back where you were at ${hm(c.s)}, before the rewind` : `Rewound to <b>${when(c)}</b>, ${esc(c.kind === 'user' ? '“' + c.msg + '”' : shortMsg(c))}`;
          showToast(`<span class="k">↺</span><span>${what.charAt(0).toUpperCase() + what.slice(1)}. ${ownOf().map((w) => w[2]).join(' and ')} reloaded${others.length ? `, and ${others[0][1]} reloads ${others.map((w) => w[2]).join(', ')}` : ''}; the cells are stale, since Python’s memory was not rewound.</span><button data-act="undo">Undo</button>`);
        }
        function undo() {
          const D = S.data;
          if (!D.last) return;
          const back = D.last.from;
          const res = applyRewind(back, null);
          render();
          scroll.scrollTop = scroll.scrollHeight;
          toastRewound(back, res, null);
        }

        /* ---------- the note ---------- */
        const toast = $('#toast');
        function showToast(h) { toast.innerHTML = h; toast.hidden = false; }
        function hideToast() { toast.hidden = true; }
        toast.addEventListener('click', (e) => { if (e.target.closest('[data-act="undo"]')) { hideToast(); undo(); } });

        /* ---------- the strip: the whole record at the room's edge ---------- */
        function drawMini() {
          const H = river.offsetHeight;
          const show = H > scroll.clientHeight * 1.15;
          mini.hidden = !show;
          scroll.classList.toggle('nobar', show);
          if (!show) return;
          const mh = mini.clientHeight, k = mh / H, P = [];
          S.rows.forEach((r) => {
            const y = (r.cy * k).toFixed(1);
            if (r.type === 'run') P.push(`<rect class="${r.item.err ? 'm-err' : 'm-run'}" x="4" y="${y}" width="8" height="1"/>`);
            else if (r.type === 'timer') P.push(`<rect class="m-tick" x="6.5" y="${y}" width="3" height="1"/>`);
            else if (r.type === 'cluster') P.push(`<rect class="m-tick" x="6.5" y="${(r.y * k).toFixed(1)}" width="3" height="${Math.max(1, r.h * k).toFixed(1)}"/>`);
            else if (r.type === 'dayfold') P.push(`<rect class="m-reach" x="5.5" y="${((r.y + 9) * k).toFixed(1)}" width="5" height="${Math.max(2, (r.h - 18) * k).toFixed(1)}" rx="1.5"><title>${dayInfo(r.day.key).short}</title></rect>`);
            else if (r.type === 'dayhead') P.push(`<rect class="m-day" x="1" y="${y}" width="14" height="1"><title>${dayInfo(r.day.key).short}</title></rect>`);
            else if (r.type === 'rto') P.push(`<rect class="m-rw" x="1.5" y="${y - 1}" width="13" height="2" rx="1"/>`);
            else if (r.type === 'user') P.push(`<rect class="m-user" x="11.5" y="${y - 1.5}" width="3" height="3"/>`);
          });
          mini.innerHTML = `<svg width="16" height="${mh}">${P.join('')}<rect id="mview" x="0.5" y="0" width="15" height="10" rx="3"/></svg>`;
          miniView();
        }
        function miniView() {
          const v = $('#mview');
          if (!v || mini.hidden) return;
          const H = river.offsetHeight, mh = mini.clientHeight;
          v.setAttribute('y', Math.max(0.5, (scroll.scrollTop / H) * mh));
          v.setAttribute('height', Math.max(8, Math.min(mh - 1, (scroll.clientHeight / H) * mh)));
        }
        scroll.addEventListener('scroll', miniView, { passive: true });
        let dragging = false;
        const miniGo = (e) => {
          const r = mini.getBoundingClientRect();
          const f = (e.clientY - r.top) / r.height;
          scroll.scrollTop = f * river.offsetHeight - scroll.clientHeight / 2;
        };
        mini.addEventListener('pointerdown', (e) => { dragging = true; mini.setPointerCapture(e.pointerId); miniGo(e); });
        mini.addEventListener('pointermove', (e) => { if (dragging) miniGo(e); });
        mini.addEventListener('pointerup', () => { dragging = false; });

        /* ================= interactions ================= */
        function select(sha, opts) {
          S.sel = sha;
          S.landed = null;
          S.hintOn = false;
          render();
          if (opts && opts.center) center(sha);
          else if (sha) keepInView(sha);
        }
        function center(sha) { const r = S.rmap.get(sha); if (r) scroll.scrollTop = r.cy - scroll.clientHeight * 0.32; }
        function keepInView(sha) {
          const r = S.rmap.get(sha);
          if (!r) return;
          if (r.cy < scroll.scrollTop + 40) scroll.scrollTop = r.cy - 60;
          else if (r.cy > scroll.scrollTop + scroll.clientHeight - 60) scroll.scrollTop = r.cy - scroll.clientHeight + 120;
        }
        rowsEl.addEventListener('click', (e) => {
          const el = e.target.closest('.row');
          if (!el || S.busy) return;
          const r = S.rows[+el.dataset.i];
          hideToast();
          if (r.type === 'dayfold') { S.dayFold.set(r.day.key, false); keepAnchor(() => render(), r); return; }
          if (r.type === 'dayhead') { S.dayFold.set(r.day.key, true); if (S.sel && itemBySha(S.sel) && itemBySha(S.sel).day === r.day.key) S.sel = null; keepAnchor(() => render(), r); return; }
          if (r.type === 'cluster') { r.items.forEach((c) => S.openClusters.add(c.sha)); keepAnchor(() => render(), r); return; }
          if (r.item && PICK.has(r.type)) {
            if (S.sel === r.item.sha) {
              // A second click on the selected node rewinds; a double-click is one click, not two.
              if (e.detail > 1 || performance.now() - S.selAt < 450) return;
              const b = card.querySelector('[data-act="rewind"]');
              if (b && !b.disabled) startRewind(r.item);
            } else {
              S.selAt = performance.now();
              select(r.item.sha);
            }
          }
          e.stopPropagation();
        });
        // a fold or unfold keeps the row under the pointer where it was
        function keepAnchor(fn, r) {
          const before = r.y - scroll.scrollTop;
          const key = r.day ? r.day.key : null;
          fn();
          const again = S.rows.find((x) => (key ? x.day && x.day.key === key : x.item && r.items && x.item === r.items[0]));
          if (again) scroll.scrollTop = again.y - before;
        }
        card.addEventListener('click', (e) => {
          const b = e.target.closest('[data-act]');
          if (!b) return;
          if (b.dataset.act === 'close') select(null);
          if (b.dataset.act === 'rewind') startRewind(itemBySha(S.sel));
          if (b.dataset.act === 'without' || b.dataset.act === 'anyway') {
            const w = S.late;
            w.answered = true;
            S.data.windows.push(w);
            if (b.dataset.act === 'without') { const box = card.querySelector(`input[data-path="${w[2]}"]`); if (box) box.checked = false; }
            startRewind(itemBySha(S.sel));
          }
          e.stopPropagation();
        });
        card.addEventListener('change', (e) => {
          const box = e.target.closest('input[data-path]');
          if (!box) return;
          box.closest('.nr').classList.toggle('off', !box.checked);
          const all = $$('#card input[data-path]'), on = all.filter((b) => b.checked).length;
          const c = itemBySha(S.sel);
          const btn = card.querySelector('.rw');
          btn.disabled = on === 0;
          card.querySelector('.rwl').textContent = on === all.length ? `Rewind to ${when(c)}` : on === 0 ? 'Choose a file to rewind' : `Rewind ${plural(on, 'file')} to ${when(c)}`;
        });
        scroll.addEventListener('click', (e) => {
          if (S.busy || e.target.closest('.row') || e.target.closest('#card')) return;
          if (S.sel) select(null);
          hideToast();
        });
        document.addEventListener('keydown', (e) => {
          if (!S.data || S.busy || e.target.closest('#states')) return;
          const picks = S.rows.filter((r) => r.item && PICK.has(r.type));
          const i = picks.findIndex((r) => r.item.sha === S.sel);
          if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.altKey) {
            // ⌥↑ ⌥↓: the next run or event, skipping timer commits
            e.preventDefault();
            const step = e.key === 'ArrowDown' ? 1 : -1;
            let j = i < 0 ? picks.length : i;
            do { j += step; } while (j >= 0 && j < picks.length && picks[j].type === 'timer');
            if (picks[j]) select(picks[j].item.sha);
          } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            let j = i < 0 ? picks.length - 1 : i + (e.key === 'ArrowDown' ? 1 : -1);
            j = Math.max(0, Math.min(picks.length - 1, j));
            if (picks[j]) select(picks[j].item.sha);
          } else if (e.key === 'Escape') { select(null); hideToast(); }
          else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && S.sel) { const b = card.querySelector('[data-act="rewind"]'); if (b && !b.disabled) startRewind(itemBySha(S.sel)); }
          else if (e.key === 'End') { e.preventDefault(); scroll.scrollTop = scroll.scrollHeight; }
          else if (e.key === 'Home') { e.preventDefault(); scroll.scrollTop = 0; }
        });
        $$('#zoom button').forEach((b) => b.addEventListener('click', () => {
          if (!S.data) return;
          const anchor = S.sel || null;
          S.zoom = b.dataset.z;
          S.dayFold = new Map();
          S.openClusters = new Set();
          render();
          if (anchor && S.rmap.get(anchor) && S.rmap.get(anchor).item) center(anchor);
          else scroll.scrollTop = scroll.scrollHeight;
        }));
        $('#rb-branch').addEventListener('click', () => { if (!S.data || !S.data.branch) return; S.showBranch = !S.showBranch; if (!S.showBranch && S.sel && itemBySha(S.sel) && itemBySha(S.sel).kind === 'user') S.sel = null; render(); });
        $('#rb-now').addEventListener('click', () => { scroll.scrollTop = scroll.scrollHeight; });
        $('#rb-start').addEventListener('click', () => { scroll.scrollTop = 0; });
        let rz;
        window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.data) render(); else drawMini(); }, 60); });

        /* ================= no record ================= */
        // Each reason is what the graph request answers as {state: 'none', reason} (or 'paused'
        // before the first commit), said in the record's own terms.
        function emptyHTML(v) {
          const bed = (main) => `<svg width="70" height="${main ? 210 : 170}" viewBox="0 0 70 ${main ? 210 : 170}">
              <line class="riv dot" x1="22" y1="12" x2="22" y2="${main ? 192 : 152}"/>
              <circle cx="22" cy="12" r="4.5" fill="none" stroke="rgba(157,184,214,0.55)" stroke-width="1.5"/>
              <circle cx="22" cy="${main ? 196 : 156}" r="6.5" fill="#2b2a2d" stroke="rgba(157,184,214,0.8)" stroke-width="1.5" stroke-dasharray="2.6 2.2"/>
              ${main ? `<line class="trib" x1="50" y1="40" x2="50" y2="150"/>${[40, 95, 150].map((y) => `<rect x="44.5" y="${y - 5.5}" width="11" height="11" rx="3" fill="#2b2a2d" stroke="#d8d6d1" stroke-width="1.6"/>`).join('')}` : ''}
            </svg>`;
          const V = {
            unsaved: { main: false, title: 'Not saved yet', body: `<p><b>Untitled.py</b> is not in a folder yet, so there is nothing to record. Save it in a folder of its own, like ~/Projects/week-4, and the record begins at once: its first commit lands as the window moves onto the folder, and from then on every cell run and every minute something changes.</p><p>Each will be a point on this line, and you can go back to any of them.</p>`, foot: 'the record follows the git repository the document’s folder is in, and makes one where there is none' },
            refused: { main: false, title: 'No record here', body: `<p><b>analysis.py</b> is in ~/Documents itself, where the record does not make a repository. In a folder of its own, like ~/Documents/week-3, it is recorded from the moment it opens.</p>`, foot: 'never the home folder or its standard folders, a cloud-synced root, a temporary folder, or where credentials are kept' },
            off: { main: false, title: 'The record is off', body: `<p>Autosave is off for this app, so nothing is being recorded for <b>week-3</b>, and there is nothing to go back to.</p>`, foot: '"autosave": true in the app’s config turns it on · KNUTH_AUTOSAVE=0 turns it off for a test' },
            waiting: { main: true, title: 'Waiting to begin, beside main', body: `<p><b>Paper_Draft</b> has three commits on <span class="br">main</span>, and a rebase is in progress, so the record has not made its first commit yet. It makes it when the rebase ends, beside main, and ties itself to main wherever they hold the same files.</p>
                <ul class="ucs"><li><span class="t">${dayInfo('2026-09-29').short}</span><span class="m">Outline and data sources</span></li><li><span class="t">${dayInfo('2026-09-30').short}</span><span class="m">Clean the survey export</span></li><li><span class="t">${dayInfo('2026-10-01').short}</span><span class="m">First figures</span></li></ul>`, foot: 'main: 3 commits · claerbout-autosave: none yet · paused while git is at work' },
          }[v];
          return `<div class="em"><div class="bed">${bed(V.main)}</div><div><h2>${V.title}</h2>${V.body}<div class="foot">${V.foot}</div></div></div>`;
        }
        function showEmpty(v) {
          S.data = null;
          S.paused = v === 'waiting' ? 'a rebase is in progress on main' : null;
          scroll.hidden = true;
          mini.hidden = true;
          card.hidden = true;
          const e = $('#empty');
          e.hidden = false;
          e.innerHTML = emptyHTML(v);
          $('#t-path').textContent = v === 'waiting' ? '~/Projects/Paper_Draft' : v === 'refused' ? '~/Documents' : v === 'unsaved' ? 'not saved' : '~/Projects/ECON_0150/week-3';
          $('#t-meta').textContent = v === 'off' ? 'record off' : v === 'unsaved' || v === 'refused' ? 'no record' : 'no commits yet · claerbout-autosave';
          $('#here').innerHTML = `<span class="app">K</span><span class="doc">${v === 'unsaved' ? 'Untitled.py' : 'analysis.py'}</span>`;
          $$('#zoom button').forEach((b) => { b.disabled = true; b.classList.remove('on'); });
          const rb = $('#rb-branch');
          rb.disabled = v !== 'waiting';
          rb.classList.toggle('on', v === 'waiting');
          const rec = $('#rec');
          rec.hidden = !S.paused;
          if (S.paused) rec.querySelector('.why2').textContent = S.paused;
          $$('#grp-empty [data-ev]').forEach((b) => b.classList.toggle('on', b.dataset.ev === v));
        }

        /* ================= the states (mockup chrome) ================= */
        const CAP = {
          rest: 'At rest, at 10:41, opened in <b>Runs</b>. <b>week-3</b> is a folder the shell made a repository of, so the record is the only line. Time runs down and the window opens at the mouth, now. Bold dots are cell runs; a red ring is a run that raised (09:17, 10:30). Faint beads are timer commits, and three or more in a row fold to one line saying what they caught: “13 timer commits · paper.typ”. Yesterday is folded at the top; the 14-minute pause is dotted. Click any node; ⌥↑ ⌥↓ jump between runs.',
          selected: 'A node selected: <b>10:14, cell run [8]</b>. Its card sits beside it: what the commit changed (the strip lights cell 8 among the document’s cells, then its diff and the figure it redrew), then what a rewind would change against now: the strip says cell 9 comes out and cells 7 and 8 go back, values.json’s names go back, and the paper too, since Plass shares the folder. Untick a file to leave it. The labels of the beads nearby show. Hover the node: a second click rewinds.',
          error: 'An error run: <b>09:17, cell run [4] (error)</b>, the red ring. Knuth’s notice says the run raised, and the record’s message carries it, so the moment before a mistake can be found by eye. The fix lands two minutes later at 09:19.',
          rewinding: 'The node is clicked again (or <b>Rewind to 10:14</b> pressed). The card says each step as the shell takes it: Knuth saves analysis.py, now is recorded (<b>knuth: rewind from …</b>), the 10:14 files are written into the folder, the record commits again (<b>knuth: rewind to …</b>), analysis.py reloads, and Plass reloads paper.typ when it sees the rewind. Then the river grows at the tip.',
          after: 'After the rewind. Two new nodes at the tip: the ring keeps the files as they were at the click, and the blue node holds the 10:14 files again, with a dashed arc back up to the moment it reproduces (which now wears a ↺ tag). Nothing above moved. <b>Undo</b> is one more rewind, to the ring: try it.',
          branch: 'The same morning in a repository where you commit too. Your branch <b>main</b> is a tributary: square nodes, your own words in serif. In git the record and main share no commit, so the view ties them where they hold the same files: a curve from the record commit whose files match every file your commit has, dotted when one differs (10:16 has the starter’s paper.typ). Rewinding to a commit on main writes the files it has and leaves the others, and main stays where it is.',
          paused: 'The record paused: a rebase is in progress on main, so the record writes nothing (autosave.js’s guards). The pill in the top bar says so; the card still shows what a rewind would change, and its button waits, saying why. The same pill names an index.lock, a merge, or the record’s branch checked out.',
          late: 'Plass opened meanwhile. When this card was drawn only Knuth had the project open; then paper.typ was opened in Plass. Click the node again or press Rewind: the shell checks before writing anything and refuses with <b>other-app</b>, and the card offers to rewind without paper.typ, or anyway.',
          long: 'Three weeks of a research project, 12 working days. Each earlier day folds to one reach with its counts (click to open it, click its heading to fold it again). In <b>Runs</b>, three or more timer commits in a row fold to one line naming the cells or the paper they caught. <b>Days · Runs · Every commit</b> in the top bar zooms the whole river. The strip at the right edge is the whole record: days, runs (red ones raised), your commits (squares), rewinds (blue); drag it to travel.',
          empty: 'No record. A dry bed: the source, a dotted line, and now. Below, the reasons the graph request can give, each said in words: an Untitled document, a folder where the record does not start, the record off, and a repository whose first record commit waits for a rebase.',
        };
        function go(name, v) {
          $$('#states [data-st]').forEach((b) => b.classList.toggle('on', b.dataset.st === name));
          $('#grp-empty').hidden = name !== 'empty';
          $('#cap').innerHTML = CAP[name];
          hideToast();
          S.state = name; S.sel = null; S.busy = false; S.landed = null; S.hintOn = false; S.late = null;
          S.paused = name === 'paused' ? 'a rebase is in progress on main' : null;
          S.dayFold = new Map(); S.openClusters = new Set();
          if (name === 'empty') { showEmpty(v || 'unsaved'); return; }
          $('#empty').hidden = true;
          scroll.hidden = false;
          S.data = name === 'long' ? makeLong() : makeMorning(name === 'branch' || name === 'paused' || name === 'late');
          S.zoom = 'runs';
          S.showBranch = !!S.data.branch;
          if (name === 'late') { S.late = S.data.windows.find((w) => w[1] === 'Plass'); S.data.windows = S.data.windows.filter((w) => w !== S.late); }
          const t1014 = byTime(S.data, '10:14:07', TODAY);
          if (name === 'after') { const res = applyRewind(t1014, null); render(); scroll.scrollTop = scroll.scrollHeight; toastRewound(t1014, res, null); return; }
          if (name === 'selected' || name === 'rewinding' || name === 'paused' || name === 'late') {
            S.sel = t1014.sha; render(); center(S.sel);
            if (name === 'rewinding') {
              setTimeout(() => { if (S.state !== 'rewinding') return; S.hintOn = true; render(); }, 350);
              setTimeout(() => { if (S.state === 'rewinding' && S.sel === t1014.sha) startRewind(t1014); }, 1300);
            }
            return;
          }
          if (name === 'error') { const c = byTime(S.data, '09:17:12', TODAY); S.sel = c.sha; render(); center(S.sel); return; }
          if (name === 'branch') { S.sel = S.data.branch.commits[2].sha; render(); center(S.sel); return; }
          render();
          if (name === 'long') { const h = S.rows.find((r) => r.type === 'dayhead'); scroll.scrollTop = h ? h.y - scroll.clientHeight * 0.55 : scroll.scrollHeight; }
          else scroll.scrollTop = scroll.scrollHeight;
        }
        $$('#states [data-st]').forEach((b) => b.addEventListener('click', () => go(b.dataset.st)));
        $$('#states [data-ev]').forEach((b) => b.addEventListener('click', () => go('empty', b.dataset.ev)));
        $('#states header').addEventListener('click', () => $('#states').classList.toggle('min'));
        go('rest');
      })();
    </script>
  </body>
</html>
