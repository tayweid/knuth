<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History — the ledger tree</title>
    <style>
      /* THE HISTORY WINDOW: THE LEDGER TREE. (Design session of 2026-10-02;
         one of three directions for the autosave record's history view.)

         Taylor: "a git history rewind visualizer, with the commits in a
         path, with branches visualized, and the ability to rewind by
         clicking on a node in the window."

         The direction: the record as git log --graph, typeset. A compact
         column of rows, one per commit, sits on the frame where Zen keeps
         its vertical tabs; the lanes are thin rails with rounded elbows, not
         slashes; each row holds the node, the message (a run names its cell
         as a chip), the app in small caps and the time in tabular figures.
         The column works like Zen's tabs: the selected row is the page shown
         in the room, and the room shows the document at that moment, as a
         diff (the step, or against now). The rewind is in the row's menu.

         What the drawing means:
         - The left rail is the path: the record (claerbout-autosave), drawn
           by content, the way an undo tree is. A rewind is a step forward
           that reproduces an older state, so after one the stretch that was
           rewound away slides off the path into a lane of its own (git's
           real chain still joins it at the new tip), and a dashed rail runs
           from the new tip back to the moment it reproduces.
         - The user's branches (main) are blue lanes to the right. git never
           joins them to the record (the record's first commit is a root),
           so where they touch is drawn as a dotted tie: at this moment the
           record held the same files as the user's commit.
         - Timer commits between runs fold into one row ("4 timer saves");
           the zoom goes Sittings / Runs / Every commit; a gap of more than
           half an hour breaks the rails and says how long nothing happened.

         The frame is the suite's (Plass notes, session panes round two):
         a dark grey surround, a 44px rail of 32px tiles, the room rounded at
         all four corners on one 8px edge. Open by double-click; the card at
         the bottom right switches the states (it is mockup chrome). */
      :root {
        --frame: #18181a;
        --frame-ink: #d5d3cf;
        --frame-ink-soft: #85837f;
        --frame-ink-faint: #5f5d5a;
        --tile: #2c2c31;
        --tile-hover: #212124;
        --pill: #232326;
        --tip: #0e0e10;
        --bg: #2b2a2d;
        --room-pane: #232226;
        --room-line: rgba(255, 255, 255, 0.07);
        --room-ink: #d8d6d1;
        --room-ink-soft: #8f8d88;
        --blue: #9db8d6;
        --green: #6ea576;
        --amber: #c98a1d;
        --red: #cd6452;
        --serif: 'STIX Two Text', 'Charter', 'Georgia', serif;
        --prose: 'CMU Serif', 'Computer Modern Serif', 'Georgia', serif;
        --mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        --topbar: 44px;
        --rail: 44px;
        --edge: 8px;
        --col: 322px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--frame); font: 15px/1.55 var(--sans); }
      button { font: inherit; }

      /* ---------- the window ---------- */
      #app { position: fixed; inset: 0; background: var(--frame); overflow: hidden; color: var(--frame-ink); }
      body.sized { background: radial-gradient(ellipse at 50% 28%, #5a5960, #34333a 62%, #29282d); }
      body.sized #app {
        inset: auto; left: var(--cx, 50%); top: calc(50% - 14px); width: var(--w); height: var(--h);
        transform: translate(-50%, -50%) scale(var(--s, 1)); border-radius: 12px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 30px 90px rgba(0, 0, 0, 0.5);
      }
      #sizelabel { position: fixed; left: var(--cx, 50%); bottom: 10px; transform: translateX(-50%); font: 12px var(--sans); color: rgba(255, 255, 255, 0.7); display: none; white-space: nowrap; }
      body.sized #sizelabel { display: block; }

      /* ---------- the top bar: part of the frame ---------- */
      #topbar { position: absolute; top: 0; left: 0; right: 0; height: var(--topbar); display: flex; align-items: center; gap: 2px; padding: 0 var(--edge) 0 14px; }
      #topbar svg, #rail svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .lights { display: flex; gap: 8px; margin-right: 14px; }
      .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #46464a; }
      /* the bar's left zone sits over the rail and the column; the project pill starts where the room does */
      .tl { flex: 0 0 auto; width: calc(var(--rail) + var(--col) - 14px); display: flex; align-items: center; padding-right: 10px; }
      .tl #recpill { margin-left: auto; }
      #projpill { flex: 1; min-width: 0; height: 30px; margin: 0; border-radius: 8px; background: var(--pill); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
      #projpill .ico { color: var(--frame-ink-soft); display: inline-flex; }
      #projpill .name { font: 15px/1 var(--serif); letter-spacing: 0.06em; color: var(--frame-ink); white-space: nowrap; }
      #projpill .path { color: var(--frame-ink-soft); font: 12px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      #projpill .head { margin-left: auto; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font: 11.5px var(--sans); color: var(--frame-ink-soft); white-space: nowrap; }
      #projpill .head b { font: 500 11.5px var(--mono); color: var(--blue); }
      #projpill .head svg { width: 13px; height: 13px; color: var(--blue); }
      #recpill { position: relative; flex: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 0; border-radius: 8px; background: var(--pill); color: var(--frame-ink-soft); font: 11.5px var(--sans); white-space: nowrap; cursor: default; }
      #recpill i { width: 7px; height: 7px; border-radius: 50%; background: #4caf7d; display: block; flex: 0 0 auto; }
      #recpill.paused i { background: var(--amber); }
      #recpill.none i { background: transparent; box-shadow: inset 0 0 0 1.3px var(--frame-ink-soft); }
      #recpill .sep { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.11); }
      #recpill .st { color: var(--frame-ink); }
      #recpill.paused .st { color: #e2b765; }
      #recpill.got { animation: got 1.1s ease-out; }
      @keyframes got { 0% { box-shadow: 0 0 0 2px rgba(157, 184, 214, 0.6); } 100% { box-shadow: 0 0 0 2px rgba(157, 184, 214, 0); } }

      /* ---------- the rail: projects the shell has windows on ---------- */
      #rail { position: absolute; top: var(--topbar); left: 0; bottom: var(--edge); width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 0 2px; }
      .rb { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--frame-ink); cursor: pointer; flex: 0 0 auto; }
      .rb:hover { background: var(--tile-hover); }
      .rb.on { background: var(--tile); }
      .rb.dim { color: var(--frame-ink-soft); }
      .rb .badge { position: absolute; right: 3px; bottom: 3px; font: 600 8.5px/1 var(--sans); color: var(--frame-ink-soft); }
      .rb[data-label]::after {
        content: attr(data-label); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--tip); color: var(--frame-ink); font: 12px/1.3 var(--sans); white-space: nowrap;
        padding: 5px 9px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, 0.08); opacity: 0; pointer-events: none; transition: opacity 0.12s; z-index: 60;
      }
      .rb:hover::after { opacity: 1; }
      .rule { width: 18px; height: 1px; background: rgba(255, 255, 255, 0.09); margin: 5px 0; flex: 0 0 auto; }
      .grow { flex: 1; }

      /* ---------- the column: the tree, on the frame like Zen's tabs ---------- */
      #col { position: absolute; top: var(--topbar); left: var(--rail); width: var(--col); bottom: var(--edge); display: flex; flex-direction: column; }
      #colhead { flex: 0 0 auto; padding: 0 10px 6px 2px; }
      .zoom { display: flex; background: var(--pill); border-radius: 8px; padding: 2px; }
      .zoom button { flex: 1; border: 0; background: transparent; color: var(--frame-ink-soft); font: 12px var(--sans); padding: 4px 0; border-radius: 6px; cursor: pointer; white-space: nowrap; }
      .zoom button:hover { color: var(--frame-ink); }
      .zoom button.on { background: var(--tile); color: var(--frame-ink); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05); }
      .legend { display: flex; gap: 12px; align-items: center; margin: 9px 2px 0 8px; font: 11.5px var(--sans); color: var(--frame-ink-soft); white-space: nowrap; }
      .legend span.lg { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
      .legend span.lg:hover { color: var(--frame-ink); }
      .legend i { width: 14px; height: 0; border-top: 1.5px solid #77756f; display: block; }
      .legend .lm i { border-color: rgba(157, 184, 214, 0.75); }
      .legend .ls i { border-color: #4f4e4b; }
      .legend .lt i { border-top: 1.5px dotted rgba(157, 184, 214, 0.7); }
      .legend .cnt { margin-left: auto; font-variant-numeric: tabular-nums; }
      #rows { position: relative; flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 0 8px 36px 2px; outline: none; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.12) transparent; }
      #colfoot { flex: 0 0 auto; padding: 7px 10px 6px 10px; font: 11px/1.4 var(--sans); color: var(--frame-ink-faint); border-top: 1px solid rgba(255, 255, 255, 0.05); }
      #colfoot b { font-weight: 400; color: var(--frame-ink-soft); }
      #colfoot .mono { font-family: var(--mono); font-size: 10.5px; }

      /* rows: one per commit, the graph drawn per row (git log --graph, typeset) */
      .row { --rowbg: var(--frame); position: relative; display: flex; align-items: center; height: 26px; border-radius: 7px; cursor: pointer; padding-right: 8px; font: 12.5px/1 var(--sans); color: var(--frame-ink); user-select: none; }
      .row:hover { --rowbg: var(--tile-hover); background: var(--rowbg); }
      .row.sel { --rowbg: var(--tile); background: var(--rowbg); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.045); }
      .row svg.g { flex: 0 0 auto; display: block; overflow: visible; align-self: flex-start; }
      .row .msg { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-left: 3px; }
      .row .sub { color: var(--frame-ink-soft); margin-left: 6px; font-size: 11.5px; }
      .row .chip { display: inline-block; font: 11px/1 var(--mono); color: #a6d0ad; background: rgba(110, 165, 118, 0.14); border-radius: 4px; padding: 2px 4px; margin-left: 5px; vertical-align: 0.5px; }
      .row .app { flex: 0 0 auto; width: 42px; text-align: right; font: italic 12px var(--serif); color: var(--frame-ink-faint); }
      .row .app.mb { color: rgba(157, 184, 214, 0.8); font-style: normal; font: 11px var(--mono); }
      .row .t { flex: 0 0 auto; width: 46px; text-align: right; font: 11.5px var(--sans); font-variant-numeric: tabular-nums; color: var(--frame-ink-soft); white-space: nowrap; }
      .row .t.rng { font-size: 10.5px; letter-spacing: -0.01em; }
      .row .more { position: absolute; right: 54px; top: 3px; width: 42px; height: 20px; display: none; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 5px; background: var(--rowbg); color: var(--frame-ink-soft); cursor: pointer; font: 600 13px/1 var(--sans); letter-spacing: 1px; }
      .row .more:hover, .row.menu .more { color: var(--frame-ink); background: #38383d; }
      .row:hover .more, .row.sel .more, .row.menu .more { display: inline-flex; }
      .row.r-commit.timer .msg, .row.r-fold .msg { color: #a3a19c; }
      .row.off .msg, .row.off.timer .msg { color: #7a7874; }
      .row.off .sub { color: #66645f; }
      .row.off .chip { color: #7f9b84; background: rgba(110, 165, 118, 0.07); }
      .row.off.sel .msg { color: #b9b7b2; }
      .row .tag { display: inline-block; font: 10px/1 var(--sans); border: 1px solid rgba(157, 184, 214, 0.45); color: var(--blue); border-radius: 999px; padding: 2px 6px 2px; margin-left: 6px; vertical-align: 1px; }
      .row .tag.now { border-color: rgba(255, 255, 255, 0.16); color: var(--frame-ink-soft); }
      .row .tag.first { border-color: rgba(255, 255, 255, 0.12); color: var(--frame-ink-soft); }
      .row .jump { color: var(--blue); margin-left: 6px; font-size: 11.5px; }
      .row .jump:hover { text-decoration: underline; text-underline-offset: 2px; }
      .row.ext .sub { color: #c9a35e; }
      .row .caret { display: inline-block; width: 13px; margin-left: -2px; color: var(--frame-ink-faint); font-size: 10px; }
      .row.r-fold:hover .caret, .row.r-sit:hover .caret, .row .caret:hover { color: var(--frame-ink); }
      .row.r-sit .msg { color: var(--frame-ink); }
      .row.r-sit .rug { flex: 0 0 auto; width: 50px; height: 12px; margin: 0 4px 0 6px; display: block; }
      .row.r-sit .more { right: 54px; width: 30px; }
      .row.r-day, .row.r-gap { cursor: default; }
      .row.r-day:hover, .row.r-gap:hover { background: transparent; --rowbg: var(--frame); }
      .row.r-day { height: 34px; align-items: flex-end; }
      .row.r-day .dl { padding: 0 0 7px 3px; font: 10px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--frame-ink-soft); white-space: nowrap; }
      .row.r-day .dl b { font-weight: 500; color: var(--frame-ink); letter-spacing: 0.12em; }
      .row.r-day .gl, .row.r-gap .gl { margin-left: auto; padding-bottom: 7px; font: italic 11.5px var(--serif); color: var(--frame-ink-faint); white-space: nowrap; }
      .row.r-gap { height: 22px; }
      .row.r-gap .gl { padding: 0 0 0 4px; margin-left: 0; }
      .row.r-empty { height: 30px; cursor: default; }
      .row.r-empty:hover { background: transparent; }
      .row.enter { animation: row-in 0.34s ease-out both; }
      @keyframes row-in { from { height: 0; opacity: 0; } to { height: 26px; opacity: 1; } }
      .row.flash { animation: flash 1.4s ease-out; }
      @keyframes flash { 0%, 30% { background: rgba(157, 184, 214, 0.22); } 100% { background: var(--rowbg); } }

      /* the graph's marks */
      .g path { fill: none; stroke-width: 1.3; }
      .g .e-rec { stroke: #6f6d69; }
      .g .e-side { stroke: #4b4a48; }
      .g .e-main { stroke: rgba(157, 184, 214, 0.62); }
      .g .e-dash { stroke-dasharray: 2.6 2.6; }
      .g .e-gap { stroke-dasharray: 1 3.2; }
      .g .e-fade { stroke-dasharray: 1 3.2; opacity: 0.6; }
      .g .tie { stroke: rgba(157, 184, 214, 0.6); stroke-dasharray: 1 2.4; stroke-width: 1.2; }
      .g .halo { fill: none; stroke: rgba(255, 255, 255, 0.32); stroke-width: 1; }
      #rows.hl-main .g :is(.e-rec, .e-side, .n-rec, .n-side) { opacity: 0.25; }
      #rows.hl-rec .g :is(.e-main, .n-main, .tie) { opacity: 0.25; }
      #rows.hl-side .g :is(.e-rec, .e-main, .n-rec, .n-main, .tie) { opacity: 0.25; }
      #rows.hl-tie .g :is(.e-rec, .e-side, .e-main, .n-rec, .n-side, .n-main) { opacity: 0.35; }

      /* ---------- the room: the document at the selected moment ---------- */
      #room {
        position: absolute; top: var(--topbar); left: calc(var(--rail) + var(--col)); right: var(--edge); bottom: var(--edge);
        border-radius: 10px; background: var(--bg); overflow: hidden; color: var(--room-ink);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.045), 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 26px rgba(0, 0, 0, 0.42);
      }
      #pv { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.14) transparent; }
      #pv.swap { animation: swap 0.16s ease-out; }
      @keyframes swap { from { opacity: 0.35; } to { opacity: 1; } }
      .wrap { max-width: 54rem; margin: 0 auto; padding: 0 30px 0 64px; }
      .ph { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 93%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--room-line); padding: 18px 0 11px; }
      .ph1 { display: flex; align-items: flex-end; gap: 18px; }
      .eyebrow { display: block; font: 12px var(--sans); font-variant-caps: all-small-caps; letter-spacing: 0.08em; color: var(--room-ink-soft); }
      .eyebrow .mainb { color: var(--blue); }
      .ph h1 { margin: 1px 0 0; font: 400 24px/1.2 var(--serif); color: #f0eee9; }
      .ph h1 .chip { font: 15px/1 var(--mono); color: #a6d0ad; background: rgba(110, 165, 118, 0.14); border-radius: 5px; padding: 3px 6px; margin-left: 8px; vertical-align: 3px; }
      .ph h1 .ttag { font: 11px/1 var(--sans); border: 1px solid rgba(255, 255, 255, 0.16); color: var(--room-ink-soft); border-radius: 999px; padding: 3px 7px; margin-left: 10px; vertical-align: 4px; }
      .when { margin-left: auto; text-align: right; flex: 0 0 auto; }
      .when b { display: block; font: 400 20px/1.15 var(--serif); font-variant-numeric: tabular-nums lining-nums; color: var(--room-ink); }
      .when span { font: 11.5px var(--sans); color: var(--room-ink-soft); }
      .ph2 { display: flex; align-items: center; gap: 10px; margin-top: 9px; font: 12px var(--sans); color: var(--room-ink-soft); min-height: 26px; }
      .ph2 .sha { font: 11.5px var(--mono); color: var(--room-ink-soft); }
      .ph2 .dotsep { opacity: 0.6; }
      .ph2 a, .alist a, .tie a, .banner a { color: var(--blue); text-decoration: none; cursor: pointer; }
      .ph2 a:hover, .alist a:hover, .tie a:hover, .banner a:hover { text-decoration: underline; text-underline-offset: 2px; }
      .seg { margin-left: auto; display: inline-flex; background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 2px; flex: 0 0 auto; }
      .seg button { border: 0; background: transparent; color: var(--room-ink-soft); font: 12px var(--sans); padding: 3px 11px; border-radius: 6px; cursor: pointer; }
      .seg button:hover { color: var(--room-ink); }
      .seg button.on { background: rgba(255, 255, 255, 0.1); color: var(--room-ink); }
      .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .fchip { font: 11.5px/1 var(--mono); border: 1px solid var(--room-line); border-radius: 999px; padding: 4px 9px; color: var(--room-ink); background: transparent; cursor: pointer; white-space: nowrap; }
      .fchip:hover { border-color: rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.03); }
      .fchip .st { color: var(--room-ink-soft); margin-left: 6px; font-family: var(--sans); font-size: 11px; }
      .fchip .a { color: var(--green); margin-left: 6px; }
      .fchip .d { color: var(--red); margin-left: 4px; }
      .fchip.plumb { color: var(--room-ink-soft); border-style: dashed; }
      .pb { padding-top: 18px; padding-bottom: 30vh; }
      .fsec { margin: 0 0 30px; scroll-margin-top: 150px; }
      .fsec > h3 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font: 400 15px/1.3 var(--serif); letter-spacing: 0.05em; color: var(--room-ink); }
      .fsec > h3 .fs { font: 11.5px var(--mono); letter-spacing: 0; color: var(--room-ink-soft); }
      .fsec > h3 .note { font: 12px var(--sans); letter-spacing: 0; color: var(--room-ink-soft); margin-left: auto; }

      /* the document map: every cell as a box, the changed ones lit */
      .dmap { display: flex; flex-wrap: wrap; gap: 3px; margin: 0 0 16px; }
      .dmap i { width: 21px; height: 16px; border-radius: 3px; font: 9.5px/16px var(--mono); text-align: center; font-style: normal; color: var(--room-ink-soft); background: rgba(255, 255, 255, 0.035); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); cursor: pointer; }
      .dmap i.tx { border-radius: 8px; }
      .dmap i.chg { background: rgba(110, 165, 118, 0.2); color: #cfe6d3; box-shadow: inset 0 0 0 1px rgba(110, 165, 118, 0.55); }
      .dmap i.new { background: rgba(110, 165, 118, 0.34); color: #e6f3e8; box-shadow: inset 0 0 0 1px rgba(110, 165, 118, 0.7); }
      .dmap i.back { background: rgba(201, 138, 29, 0.17); color: #efd5a4; box-shadow: inset 0 0 0 1px rgba(201, 138, 29, 0.5); }
      .dmap i.out { background: transparent; color: rgba(222, 130, 112, 0.95); box-shadow: inset 0 0 0 1px rgba(205, 100, 82, 0.5); text-decoration: line-through; }
      .dmap i.come, .dmap i.rest { background: rgba(157, 184, 214, 0.16); color: #dbe6f2; box-shadow: inset 0 0 0 1px rgba(157, 184, 214, 0.55); }
      .dkey { display: flex; gap: 14px; margin: -8px 0 16px; font: 11px var(--sans); color: var(--room-ink-soft); }
      .dkey span { display: inline-flex; align-items: center; gap: 5px; }
      .dkey i { width: 10px; height: 8px; border-radius: 2px; display: block; }

      /* cells, as Knuth draws them, with the diff's marks */
      .dcell { position: relative; margin: 0 0 14px; scroll-margin-top: 160px; }
      .dcell .cn { position: absolute; right: calc(100% + 12px); top: 21px; font: 11.5px var(--mono); color: var(--room-ink-soft); white-space: nowrap; }
      .dcell .what { font: 12px var(--sans); font-variant-caps: all-small-caps; letter-spacing: 0.08em; color: var(--room-ink-soft); margin: 0 0 3px 2px; height: 16px; }
      .dcell.same .what { visibility: hidden; }
      .dcell.same { display: none; }
      .pb.all .dcell.same { display: block; opacity: 0.6; }
      .pb.all .dfold { display: none; }
      .dcell.gone .cm { opacity: 0.5; border-style: dashed; }
      .dcell.rest .cm { box-shadow: inset 3px 0 0 rgba(157, 184, 214, 0.7); }

    <script>
      /* THE SHELL PROTOCOL THIS VIEW NEEDS (the page is one the shell serves itself,
         trusted like an app page; the same door: window.claerbout.request / .on).

         Requests
         - {type:'showHistory'}  from a Knuth or Plass page (a History… menu item):
             open or bring forward the History window on that window's project.
             -> {shown:true, root} | {shown:false, reason:'no project'}
         - {type:'projects'}  -> {current, projects:[{root, name, apps:['knuth','plass'],
             state:'recording'|'paused'|'off'|'none', reason?}]}  (the rail)
         - {type:'historyLog', root, before?:sha, limit?:1000}
             -> {root, name, state, reason?, tip, now:'same'|'changed',
                 head:{branch:'main', sha}|{detached:sha}|null,
                 branches:[{name:'main', tip, head:true}],
                 commits:[{sha, parents:[sha], tree, time, tz, ref:'record'|'main',
                           app:'knuth'|'plass'|null, trigger:'cell run'|'timer'|'session open'|
                           'session close'|'external edit'|'rewind from'|'rewind to'|null,
                           cell?:4, target?:sha, subject, author, paths:[…],
                           touched?:{'analysis.py':[cells]}}],
                 more:true|false}
             Newest first, the record and the local branches in one date-ordered log.
             The shell parses "<app>: <trigger>" into app/trigger/cell/target; tree lets
             the page draw ties (same tree) and a rewind's link; touched is cached by sha.
             Lanes, folding, sittings and zoom are the page's work.
         - {type:'historyDiff', root, from:sha|null, to:sha|'now'}
             -> {files:[{path, status:'A'|'M'|'D', kind:'percent'|'typst'|'csv'|'manifest'|
                         'svg'|'text'|'binary', add, del, before?, after?, size?}]}
             Whole blobs up to 1 MB; the page splits a percent file on its # %% markers
             and #-> outputs and diffs the lines itself, and shows an SVG in an <img>.
         - {type:'rewind', root, to:sha, tip:sha}
             -> {state:'done', from:sha|null, commit:sha, wrote:[…], removed:[…], kept:[…]}
              | {state:'refused', reason:'paused: a rebase is in progress'|'moved'|
                 'unsaved: memo.typ'|'same'}
             In order: autosave's guards; a save event to every window on the project
             (each answers {type:'saved', path}, 3 s at most); commit "<app>: rewind from
             <tip>" if the tree differs; read-tree the target into the record's temporary
             index, checkout-index into the working tree, remove what the tip had and the
             target lacks (never ignored files, never untracked/, never through a link);
             commit "<app>: rewind to <target>"; reload events; a history event.
             HEAD, the user's branches and index are never touched. tip is a
             compare-and-swap: a record that moved since the page drew it refuses.

         Events
         - history {root, tip, added:[commit…], branches} after a record commit, a
           rewind, or a move of the user's refs (watched; debounced), or
           {root, reload:true} when a branch was rewritten.
         - historyState {root, state, reason}  (the pill in the top bar)
         - historyFocus {root}  (an app asked for a project while the window is open)
         - save {reason:'rewind'}  to document pages: write the document if dirty.
         - reload {path, reason:'rewind', to:sha, removed?:true}  to document pages:
           read the file again, or show it as removed. */
      (function () {
        'use strict';
        const $ = (s, r) => (r || document).querySelector(s);
        const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const strip = (h) => h.replace(/<[^>]+>/g, '').replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&');
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        function rng(seed) {
          return function () {
            seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const shaR = rng(20261002), used = new Set();
        function newSha() { let s; do { s = Math.floor(shaR() * 0xfffffff).toString(16).padStart(7, '0'); } while (used.has(s)); used.add(s); return s; }

        /* ================= time ================= */
        const DAY = 86400;
        const DAYNAME = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const DAYDATE = ['28 September', '29 September', '30 September', '1 October', '2 October'];
        const DAYSHORT = ['Mon 28 Sep', 'Tue 29 Sep', 'Wed 30 Sep', 'Thu 1 Oct', 'Fri 2 Oct'];
        const hms = (s) => { const [h, m, x] = s.split(':').map(Number); return h * 3600 + m * 60 + (x || 0); };
        const at = (d, s) => d * DAY + hms(s);
        const two = (n) => String(n).padStart(2, '0');
        const dayOf = (t) => Math.floor(t / DAY);
        const fHM = (t) => { const s = t % DAY; return Math.floor(s / 3600) + ':' + two(Math.floor((s % 3600) / 60)); };
        const fHMS = (t) => fHM(t) + ':' + two(t % 60);
        const fWhen = (t) => (dayOf(t) === 4 ? fHM(t) : DAYSHORT[dayOf(t)].slice(0, 3) + ' ' + fHM(t));
        function dur(sec) { const m = Math.max(1, Math.round(sec / 60)); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return r ? h + ' h ' + r + ' min' : h + ' h'; }
        let NOW = at(4, '10:05:50');
        function ago(t) {
          const d = NOW - t;
          if (d < 50) return 'just now';
          if (dayOf(t) === dayOf(NOW)) return dur(d) + ' ago';
          if (dayOf(NOW) - dayOf(t) === 1) return 'yesterday';
          return dayOf(NOW) - dayOf(t) + ' days ago';
        }
        function range(ns) {
          const a = [...new Set(ns)].sort((x, y) => x - y), out = [];
          for (let i = 0; i < a.length; i++) {
            let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
            out.push(j > i + 1 ? a[i] + '–' + a[j] : j === i + 1 ? a[i] + ', ' + a[j] : String(a[i]));
            i = j;
          }

          const r = ROWS[+$('#menu').dataset.i], k = targetOfRow(r);
          if (b.dataset.act === 'rewind') rewind(k.sha);
          else if (b.dataset.act === 'compare') { closeMenu(); S.view = 'now'; renderRoom(true); }
          else if (b.dataset.act === 'unfold') { closeMenu(); toggleRow(r); }
          else if (b.dataset.act === 'copy') { b.classList.add('copied'); b.querySelector('.k').textContent = 'copied'; setTimeout(closeMenu, 650); }
        });
        document.addEventListener('mousedown', (e) => { if (S.menu && !e.target.closest('#menu') && !e.target.closest('.more')) closeMenu(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
        $('#pv').addEventListener('click', (e) => {
          const v = e.target.closest('[data-view]');
          if (v) { S.view = v.dataset.view; renderRoom(true); return; }
          const g = e.target.closest('[data-goto]');
          if (g) { goto(g.dataset.goto); return; }
          const rw = e.target.closest('[data-rewind]');
          if (rw) { rewind(rw.dataset.rewind); return; }
          const f = e.target.closest('.fchip');
          if (f) {
            const p = f.dataset.file, id = p.startsWith('figs/') ? 'cell-' + Object.keys(CELL_FIG).find((c) => CELL_FIG[c] === p) : 'file-' + p.replace(/[^\w]/g, '_');
            const el = document.getElementById(id) || document.getElementById('file-analysis_py');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
          }
          const d = e.target.closest('.dmap i');
          if (d) {
            let el = document.getElementById('cell-' + d.dataset.cell);
            if (el && el.classList.contains('same')) { S.showAll = true; $('.pb').classList.add('all'); }
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
          }
          if (e.target.closest('.dfold')) { S.showAll = true; e.target.closest('.pb').classList.add('all'); }
        });
        $$('.zoom button').forEach((b) => b.addEventListener('click', () => setZoom(b.dataset.zoom)));
        function setZoom(z) {
          const keep = S.sel && BY[S.sel] ? S.sel : S.sel && S.sel.startsWith('fold:') ? rowByKey(S.sel).members[0].sha : S.sel && S.sel.startsWith('sit:') ? (rowByKey(S.sel) || { sit: SITS[+S.sel.slice(4)] }).sit.rec.slice(-1)[0].sha : null;
          S.zoom = z; S.open.clear(); S.openSit.clear();
          $$('.zoom button').forEach((x) => x.classList.toggle('on', x.dataset.zoom === z));
          closeMenu(); refresh();
          if (keep != null && ROWOF[keep] != null) S.sel = ROWS[ROWOF[keep]].key;
          if (!rowByKey(S.sel)) S.sel = ROWS.find((r) => r.key).key;
          renderAll(); scrollToSel(true);
        }
        $$('#rail [data-proj]').forEach((b) => b.addEventListener('click', () => setProject(b.dataset.proj)));
        function setProject(p) {
          S.project = p; closeMenu();
          $$('#rail [data-proj]').forEach((x) => { x.classList.toggle('on', x.dataset.proj === p); x.classList.toggle('dim', x.dataset.proj !== p); });
          $('.zoom').style.visibility = p === 'week-4' ? 'hidden' : '';
          renderAll();
        }

        /* ================= the states (mockup chrome) ================= */
        const CAPS = {
          rest: 'The morning at rest, zoomed to Runs: each cell run its own row, the timer commits between runs folded into one ("4 timer saves"). The tip is selected, so the room shows the last step. main is the blue lane; its two commits this morning are tied to the record where the files were the same. Click any row to see that moment; ↑↓ walk the path.',
          step: 'A step selected: cell run [5] at 9:28:10, the run after prices.csv was fixed outside the apps (the external edit just below it). The room shows the document as Knuth draws it: cell 5’s figure before and after (the 9.00 price that squashed the axis is gone), the other cells folded. The boxes at the top are every cell, the changed one lit; the chips are the files the commit touched. Click the 9:27:02 link to step back one.',
          menu: 'The row’s menu (··· on hover, or a right-click, or Return): the rewind says what it would do before it does it (cells 16–20 come out, prices.csv goes back, memo.typ is taken out) and that what is here now is kept first. Choose it to play the rewind.',
          against: 'Against now: the same moment, compared with the files as they are. This is the rewind’s full preview: which cells come out or go back, which files leave the folder (Plass shows memo.typ as removed), what untracked/ cannot do (the record has only hashes), and that main is not touched.',
          after: 'After a rewind to 9:24:30. The record committed the work first (rewind from), then wrote 9:24:30’s files and committed again (rewind to): a step forward, never a reset. The path now runs from 9:24 straight to the new tip (dashed: the same files); the stretch rewound away slides into its own lane and still joins at the tip, because git’s chain is unbroken. Rewind back is the same request.',
          branch: 'A user branch beside the record: main’s commit at 9:48 selected. Its diff is since main’s last commit, built from the record between them. The tie is looser here: memo.typ was not in the commit, so the room says it differs from the record in that one file.',
          week: 'A long history: the week by sitting. Six sittings and today, a few hundred commits; each sitting is one row with its length, its commits and runs, and a rug of when they landed (tall ticks are runs). A blue ring on the main lane counts that sitting’s commits on main. Gaps say how long nothing happened. Click ▸ or → to open one.',
          every: 'Every commit, unfolded: a few hundred rows. It stays legible because each row is one line, the times are tabular and timer rows are quieter than runs; the day headers and gaps keep your place.',
          opened: 'The week by sitting with Thursday’s opened: inside, timers fold between runs as in the Runs zoom, and ← folds it back.',
          empty: 'week-4, a project with no record yet (the rail’s second folder). The column shows a dashed node where the path will start; the room explains what starts the record, and why it might not have.',
          paused: 'The record paused: git is rebasing main, so the record writes nothing (the same guards as autosave.js). The pill says so in the top bar, and the menu’s rewind waits with a reason instead of failing.',
        };
        function setState(st) {
          $$('#states [data-st]').forEach((b) => b.classList.toggle('on', b.dataset.st === st));
          $('#cap').textContent = CAPS[st] || '';
          build();
          Object.assign(S, { project: 'week-3', zoom: 'runs', view: 'step', menu: null, paused: false, showAll: false, dirty: true, lastRewind: null });
          S.open = new Set(); S.openSit = new Set(); S.enter = new Set();
          $('#menu').hidden = true;
          $$('.zoom button').forEach((x) => x.classList.toggle('on', x.dataset.zoom === 'runs'));
          refresh();
          S.sel = tip().sha;
          setProject('week-3');
          const find = (time, d) => REC.find((k) => k.t === at(d == null ? 4 : d, time));
          S.sel = tip().sha;
          if (st === 'step') S.sel = find('9:28:10').sha;
          if (st === 'menu' || st === 'against') { S.sel = find('9:24:30').sha; if (st === 'against') S.view = 'now'; }
          if (st === 'branch') S.sel = mainTip().sha;
          if (st === 'after') {
            const T = find('9:24:30');
            const from = addRecord({ t: at(4, '10:06:11'), app: 'knuth', trig: 'rewind from', cells: [{ c: 17, k: 'src' }], files: [], opt: {} });
            const to = addRecord({ t: at(4, '10:06:12'), app: 'knuth', trig: 'rewind to', target: T.sha, cells: [], files: [], opt: {} });
            NOW = at(4, '10:06:30'); S.dirty = false; S.sel = to.sha; refresh();
            void from;
          }
          if (st === 'week' || st === 'opened') {
            S.zoom = 'sittings'; $$('.zoom button').forEach((x) => x.classList.toggle('on', x.dataset.zoom === 'sittings'));
            if (st === 'opened') S.openSit.add(SITS.findIndex((s) => dayOf(s.start) === 3));
            refresh();
            S.sel = st === 'opened' ? ROWS[ROWOF[REC.find((k) => dayOf(k.t) === 3 && k.trig === 'cell run' && k.t > at(3, '16:00:00')).sha]].key : 'sit:' + (SITS.length - 1);
          }
          if (st === 'every') { S.zoom = 'all'; $$('.zoom button').forEach((x) => x.classList.toggle('on', x.dataset.zoom === 'all')); refresh(); S.sel = tip().sha; }
          if (st === 'paused') { S.paused = true; S.sel = find('9:24:30').sha; }
          if (st === 'empty') { setProject('week-4'); return; }
          renderAll();
          if (st === 'opened') scrollToSel(true); else if (st === 'week' || st === 'every' || st === 'rest' || st === 'after') $('#rows').scrollTop = 0; else scrollToSel(true);
          if (st === 'menu' || st === 'paused') { const i = ROWS.findIndex((r) => r.key === S.sel); requestAnimationFrame(() => openMenu(i)); }
          $('#rows').focus({ preventScroll: true });
        }
        $$('#states [data-st]').forEach((b) => b.addEventListener('click', () => setState(b.dataset.st)));
        $('#states header').addEventListener('click', () => { $('#states').classList.toggle('min'); scaleApp(); });

        /* ================= the window ================= */
        const WIN = { fill: null, 1440: [1440, 900, '1440 × 900 · a laptop, full screen'], 1100: [1100, 760, '1100 × 760 · a window beside Knuth'] };
        let win = 'fill';
        const app = $('#app'), body = document.body;
        function setWin(k) {
          win = k; closeMenu();
          $$('#states [data-win]').forEach((b) => b.classList.toggle('on', b.dataset.win === k));
          if (!WIN[k]) { body.classList.remove('sized'); app.style.removeProperty('--w'); app.style.removeProperty('--h'); }
          else { body.classList.add('sized'); app.style.setProperty('--w', WIN[k][0] + 'px'); app.style.setProperty('--h', WIN[k][1] + 'px'); $('#sizelabel').textContent = WIN[k][2]; }
          scaleApp();
        }
        function scaleApp() {
          if (!WIN[win]) return;
          const panel = $('#states').classList.contains('min') ? 0 : 300;
          const availW = innerWidth - panel;
          const s = Math.min(1, (availW - 24) / WIN[win][0], (innerHeight - 60) / WIN[win][1]);
          app.style.setProperty('--s', s.toFixed(4));
          app.style.setProperty('--cx', availW / 2 + 'px');
          $('#sizelabel').style.setProperty('--cx', availW / 2 + 'px');
        }
        $$('#states [data-win]').forEach((b) => b.addEventListener('click', () => setWin(b.dataset.win)));
        addEventListener('resize', () => { scaleApp(); closeMenu(); });

        setState('rest');
      })();
    </script>
  </body>
</html>
