name: Build GitHub release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Verify release tag
        run: python python/scripts/check_release.py "${{ github.event.release.tag_name }}"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.3.0
          python -m build python --outdir dist
      - name: Store immutable release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  app:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Knuth.app (universal, ad-hoc signed)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          APP_VERSION="${RELEASE_TAG#v}" app/build.sh
          mkdir -p dist
          # ditto keeps the bundle's metadata; a plain zip would not.
          ditto -c -k --keepParent app/build/Knuth.app dist/Knuth.app.zip
      - name: Store the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knuth-app
          path: dist/Knuth.app.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Retrieve the app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: knuth-app
          path: dist/
      - name: Attach distributions and the app to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/Knuth.app.zip --clobber
