name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # The built app is committed so pip installs carry a UI; this is what
      # keeps that from silently shipping an old one.
      - run: npm run check:web
      - run: npm test
      # No --with-deps: it shells out to apt, which took 373 of this job's 380
      # seconds and then timed out. The ubuntu-latest image already ships the
      # libraries chromium needs, so the browser download is all that is left —
      # and cached, that is seconds. If a library ever does go missing the
      # tests fail saying which, which beats a six-minute hang saying nothing.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 3
      - run: npm run test:browser
      - run: npm run build
        env:
          VITE_KNUTH_SOURCE_REF: ${{ github.sha }}

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            websockets: 'websockets==14.0'
          - os: macos-latest
            python-version: '3.14'
            websockets: 'websockets>=14.0'
          # windows-latest dropped for now: single-developer project, no
          # Windows machine in use. Restore this leg alongside the
          # cross-platform release gates (docs/ROADMAP.md); the corpus
          # fixtures are already checkout-proof via .gitattributes.
          #          - os: windows-latest
          #            python-version: '3.14'
          #            websockets: 'websockets>=14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install "${{ matrix.websockets }}"
      - run: python -m pip install -e './python[test]'
      - run: python -m pytest python/tests

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r python/requirements-audit.txt
      - run: python -m pip wheel --no-deps ./python --wheel-dir wheelhouse
      - run: python -m venv /tmp/knuth-wheel-smoke
      - run: /tmp/knuth-wheel-smoke/bin/python -m pip install wheelhouse/*.whl
      - run: /tmp/knuth-wheel-smoke/bin/knuth --help

  deploy:
    if: github.event_name != 'pull_request'
    needs: [frontend, python, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_KNUTH_SOURCE_REF: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Create/enable the Pages site from the workflow itself — the
          # Settings->Pages UI state has been unreliable for this repo.
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
