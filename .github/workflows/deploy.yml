name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      # The built app is committed so pip installs carry a UI; this is what
      # keeps that from silently shipping an old one.
      - run: npm run check:web
      - run: npm test
      # No --with-deps: it shells out to apt, which took 373 of this job's 380
      # seconds and then timed out. The ubuntu-latest image already ships the
      # libraries chromium needs, so the browser download is all that is left —
      # and cached, that is seconds. If a library ever does go missing the
      # tests fail saying which, which beats a six-minute hang saying nothing.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
        timeout-minutes: 3
      - run: npm run test:browser
      - run: npm run build
        env:
          VITE_KNUTH_SOURCE_REF: ${{ github.sha }}
      # The verified site, handed to the Mac app build and to the deploy.
      # dist has no dotfiles, so upload-artifact's default of leaving hidden
      # files out drops nothing.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 1

  # Knuth.app: the verified site's page and the knuth package inside the
  # native shell, built on a Mac (Linux cannot compile Swift) and published
  # beside the site as app/Knuth.app.zip, which knuth.tayweid.io/install
  # downloads. Nothing is committed; every deploy is the app's release. A
  # failure here never holds the site back: the deploy then republishes the
  # app that is already live.
  app:
    if: github.event_name != 'pull_request'
    needs: [frontend]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      # The page comes from the site, so this needs no Node: the checkout
      # supplies the engine's Python and the Swift shell.
      - name: Build Knuth.app from the verified site
        run: KNUTH_WEB=dist app/build.sh "$RUNNER_TEMP/Knuth.app"
      - name: Zip it the way the installer unpacks it
        run: |
          mkdir -p app-download
          ditto -c -k --keepParent "$RUNNER_TEMP/Knuth.app" app-download/Knuth.app.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: app-download
          retention-days: 1

  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            websockets: 'websockets==14.0'
          - os: macos-latest
            python-version: '3.14'
            websockets: 'websockets>=14.0'
          # windows-latest dropped for now: single-developer project, no
          # Windows machine in use. Restore this leg alongside the
          # cross-platform release gates (docs/ROADMAP.md); the corpus
          # fixtures are already checkout-proof via .gitattributes.
          #          - os: windows-latest
          #            python-version: '3.14'
          #            websockets: 'websockets>=14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install "${{ matrix.websockets }}"
      - run: python -m pip install -e './python[test]'
      - run: python -m pytest python/tests

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r python/requirements-audit.txt
      - run: python -m pip wheel --no-deps ./python --wheel-dir wheelhouse
      - run: python -m venv /tmp/knuth-wheel-smoke
      - run: /tmp/knuth-wheel-smoke/bin/python -m pip install wheelhouse/*.whl
      - run: /tmp/knuth-wheel-smoke/bin/knuth --help

  deploy:
    # Runs when the site verified, whether or not the app built.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.frontend.result == 'success' && needs.python.result == 'success' && needs.package.result == 'success' }}
    needs: [frontend, python, package, app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - if: needs.app.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app
          path: site/app
      # A deploy replaces the whole site, so an app that did not build this
      # time would otherwise vanish from under the install line.
      - name: Keep the live app when this build of it failed
        if: needs.app.result != 'success'
        run: |
          mkdir -p site/app
          if curl -fsSL -o site/app/Knuth.app.zip https://knuth.tayweid.io/app/Knuth.app.zip; then
            echo "::warning::Knuth.app did not build; the site keeps serving the previous app."
          else
            echo "::warning::Knuth.app did not build and no previous app was found; knuth.tayweid.io/install fails until it does."
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Create/enable the Pages site from the workflow itself — the
          # Settings->Pages UI state has been unreliable for this repo.
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
